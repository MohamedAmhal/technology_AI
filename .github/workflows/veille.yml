name: Veille techno

on:
  schedule:
    # Les crons GitHub sont en UTC. Heure de Paris = UTC+2 (été) / UTC+1 (hiver, dès le 25 oct).
    - cron: "0 9 * * *"   # veille  → 11h Paris (été)
    - cron: "0 16 * * *"  # veille  → 18h Paris (été)
    - cron: "0 22 * * *"  # récap   → 00h Paris (été)
  # Permet de lancer à la main depuis l'onglet Actions
  workflow_dispatch:
    inputs:
      mode:
        description: "veille (articles) ou digest (récap du jour)"
        type: choice
        options: [veille, digest]
        default: veille

# Jamais deux runs en parallèle (sinon conflit sur le commit d'articles.db)
concurrency:
  group: veille
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Lancer le pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ] || [ "${{ inputs.mode }}" = "digest" ]; then
            python main.py digest
          else
            python main.py
          fi

      - name: Recommiter la base SQLite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: maj articles.db (run veille)"
            git pull --rebase origin master
            git push
          else
            echo "articles.db inchangée, rien à commiter"
          fi
